<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#070b14">
  <title>Gobinath Family Expense — Secure Gateway</title>
  <style>
    :root {
      --bg: #070b14;
      --card-bg: rgba(14, 21, 38, 0.85);
      --border: rgba(45, 65, 105, 0.5);
      --primary: #4f6bf7;
      --primary-hover: #3d58e3;
      --primary-glow: rgba(79, 107, 247, 0.45);
      --text: #f3f7fd;
      --muted: #8598b8;
      --input-bg: rgba(7, 13, 26, 0.9);
      --danger: #ff5263;
      --success: #2ed573;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(46, 76, 175, 0.22) 0%, transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(120, 50, 220, 0.12) 0%, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      text-align: center;
    }

    .brand-icon-wrap {
      width: 68px;
      height: 68px;
      margin: 0 auto 18px;
      background: linear-gradient(135deg, #4d72fe, #1f47dd);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 10px 25px var(--primary-glow);
    }

    h1 { font-size: 23px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em; }
    .sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }

    .user-toggle {
      display: flex;
      gap: 8px;
      background: rgba(4, 9, 20, 0.6);
      padding: 5px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 22px;
    }

    .user-btn {
      flex: 1;
      padding: 9px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .user-btn.active {
      background: rgba(79, 107, 247, 0.22);
      color: #9ab0ff;
      border: 1px solid rgba(79, 107, 247, 0.4);
    }

    .input-box {
      text-align: left;
      margin-bottom: 18px;
    }

    .input-box label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: #a0b2d2;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .input-field {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      background: var(--input-bg);
      border: 1px solid #1e2e4e;
      border-radius: 12px;
      color: var(--text);
      font-size: 14.5px;
      outline: none;
      transition: all 0.2s;
    }

    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 107, 247, 0.2);
    }

    .btn-submit {
      width: 100%;
      height: 50px;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 22px;
      box-shadow: 0 10px 22px var(--primary-glow);
      transition: all 0.2s;
    }

    .btn-submit:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .toast {
      position: fixed;
      top: 20px;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      z-index: 100;
    }
    .toast.err { background: #321217; color: #ff8591; border: 1px solid #73222a; }
    .toast.suc { background: #0f2c1f; color: #43ebb3; border: 1px solid #165b3f; }
  </style>
</head>
<body>

  <div id="toast" class="toast"></div>

  <div class="login-card">
    <div class="brand-icon-wrap">G</div>
    <h1>Gobinath Family Expense</h1>
    <p class="sub" id="form-sub">Enterprise Household Finance Ledger</p>

    <div class="user-toggle">
      <button type="button" class="user-btn active" onclick="switchUser('gobinath', 'Gobinath', this)">Gobinath</button>
      <button type="button" class="user-btn" onclick="switchUser('avadaipriya', 'Avadaipriya K.', this)">Avadaipriya K.</button>
    </div>

    <form id="auth-form">
      <input type="hidden" id="account-id" value="gobinath">

      <div class="input-box">
        <label>Account</label>
        <input type="text" id="display-user" class="input-field" value="gobinath" readonly style="opacity: 0.8; background: #0b1222;">
      </div>

      <div class="input-box" id="pass-box">
        <label id="pass-label">Password</label>
        <input type="password" id="pass-input" class="input-field" placeholder="Enter your password" required>
      </div>

      <div class="input-box" id="confirm-box" style="display: none;">
        <label>Confirm First-Time Password</label>
        <input type="password" id="confirm-input" class="input-field" placeholder="Repeat your password">
      </div>

      <button type="submit" class="btn-submit" id="btn-submit">
        <span id="btn-text">Sign In to Ledger</span> →
      </button>
    </form>
  </div>

  <script>
    // Paste your Apps Script Web App URL here when deploying live
    const APPS_SCRIPT_URL = ""; 

    let selectedUser = 'gobinath';
    let selectedName = 'Gobinath';

    function showToast(msg, isErr = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast ' + (isErr ? 'err' : 'suc');
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3500);
    }

    // Check if user has initialized their password locally or remotely
    function checkUserStatus() {
      const storedHashes = JSON.parse(localStorage.getItem('gf_passwords') || '{}');
      const isFirstTime = !storedHashes[selectedUser];

      const confirmBox = document.getElementById('confirm-box');
      const formSub = document.getElementById('form-sub');
      const passLabel = document.getElementById('pass-label');
      const btnText = document.getElementById('btn-text');

      if (isFirstTime) {
        confirmBox.style.display = 'block';
        document.getElementById('confirm-input').required = true;
        formSub.textContent = 'First-Time Login: Set your secure password';
        passLabel.textContent = 'Create New Password (min 6 chars)';
        btnText.textContent = 'Set Password & Launch';
      } else {
        confirmBox.style.display = 'none';
        document.getElementById('confirm-input').required = false;
        formSub.textContent = 'Enterprise Household Finance Ledger';
        passLabel.textContent = 'Password';
        btnText.textContent = 'Sign In to Ledger';
      }
    }

    function switchUser(id, name, btn) {
      selectedUser = id;
      selectedName = name;
      document.getElementById('account-id').value = id;
      document.getElementById('display-user').value = id;
      document.querySelectorAll('.user-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('pass-input').value = '';
      document.getElementById('confirm-input').value = '';
      checkUserStatus();
    }

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pass = document.getElementById('pass-input').value;
      const confirmPass = document.getElementById('confirm-input').value;
      const storedHashes = JSON.parse(localStorage.getItem('gf_passwords') || '{}');
      const isFirstTime = !storedHashes[selectedUser];

      if (isFirstTime) {
        if (pass.length < 6) return showToast('Password must be at least 6 characters.', true);
        if (pass !== confirmPass) return showToast('Passwords do not match.', true);
        
        // Save first-time password
        storedHashes[selectedUser] = btoa(pass);
        localStorage.setItem('gf_passwords', JSON.stringify(storedHashes));
        showToast('Password established! Launching dashboard...');
      } else {
        if (storedHashes[selectedUser] !== btoa(pass)) {
          return showToast('Invalid password. Please try again.', true);
        }
        showToast('Authenticated successfully.');
      }

      // 10-Hour Session Enforcement
      const session = {
        userId: selectedUser,
        name: selectedName,
        role: 'Owner',
        loginTime: Date.now(),
        expiresAt: Date.now() + (10 * 60 * 60 * 1000)
      };
      localStorage.setItem('gf_token', 'gf_token_' + selectedUser + '_' + Date.now());
      localStorage.setItem('gf_user', JSON.stringify(session));

      setTimeout(() => {
        window.location.href = './dashboard/index.html';
      }, 500);
    });

    // Run check on initial load
    checkUserStatus();
  </script>
</body>
</html>
