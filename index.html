<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#080c17">
  <title>Gobinath Family Expense</title>
  <link rel="stylesheet" href="./assets/app.css">
</head>
<body>
  
  <div class="ambient-light light-1"></div>
  <div class="ambient-light light-2"></div>
  <div id="toast" class="toast"></div>
  
  <div id="app" class="login-container">
    <div class="glass-card">
      
      <div class="brand-header">
        <div class="brand-logo">G</div>
        <h1>Gobinath Family Expense</h1>
        <p>Enterprise Finance Ledger</p>
      </div>

      <!-- Main Login Form -->
      <form id="login-form">
        <div class="input-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <input type="text" id="username" placeholder="e.g. gobinath" autocomplete="username" required>
          </div>
        </div>

        <div class="input-group" id="password-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="Enter your password">
          </div>
        </div>

        <button type="submit" class="btn-primary" id="login-btn">Secure Sign In</button>
      </form>

      <!-- Hidden Set Password Form for First Time Login -->
      <form id="setup-form" style="display: none;">
        <div class="input-group">
          <p style="color: var(--q-text-muted); font-size: 13px; margin-bottom: 16px;">
            First time login detected. Please establish a secure password for your account.
          </p>
          <label for="new-password">New Password</label>
          <div class="input-wrapper">
            <input type="password" id="new-password" placeholder="Minimum 6 characters" required>
          </div>
        </div>
        <button type="submit" class="btn-primary" id="setup-btn">Set Password & Login</button>
      </form>

    </div>
  </div>

  <script src="./assets/app.js"></script>
</body>
</html>
