<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#080c17">
  <title>Quntet — Friends Expense Manager</title>
  <link rel="stylesheet" href="./styles.css">
  
  <!-- Pre-render styles for instant login page load -->
  <style>
    :root {
      --q-bg: #080c17;
      --q-surface: rgba(17, 25, 45, 0.65);
      --q-border: rgba(44, 66, 112, 0.5);
      --q-primary: #5b68ff;
      --q-primary-hover: #4a55e6;
      --q-text-main: #f3f6fc;
      --q-text-muted: #8a9fc2;
      --q-glow: #3a4cfc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body {
      background-color: var(--q-bg);
      color: var(--q-text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Ambient Background Effects */
    .ambient-light {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      z-index: -1;
      opacity: 0.4;
      pointer-events: none;
    }
    .light-1 { top: -10%; left: -10%; width: 400px; height: 400px; background: var(--q-glow); }
    .light-2 { bottom: -20%; right: -10%; width: 500px; height: 500px; background: #8a2be2; opacity: 0.2; }

    /* Login Layout */
    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .glass-card {
      width: 100%;
      max-width: 420px;
      background: var(--q-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--q-border);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .brand-header { text-align: center; margin-bottom: 36px; }
    .brand-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--q-primary), #2cb4ff);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      margin: 0 auto 16px;
      box-shadow: 0 12px 24px rgba(91, 104, 255, 0.3);
    }
    
    .brand-header h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
    .brand-header p { color: var(--q-text-muted); font-size: 14px; }

    /* Form Elements */
    .input-group { margin-bottom: 20px; text-align: left; }
    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--q-text-muted);
      margin-bottom: 8px;
      padding-left: 4px;
    }

    .input-wrapper { position: relative; display: flex; align-items: center; }
    .input-wrapper svg.icon {
      position: absolute;
      left: 16px;
      width: 18px;
      height: 18px;
      color: #63779c;
      pointer-events: none;
    }

    .input-wrapper input {
      width: 100%;
      background: rgba(4, 8, 18, 0.5);
      border: 1px solid var(--q-border);
      color: var(--q-text-main);
      border-radius: 14px;
      padding: 14px 16px 14px 44px;
      font-size: 15px;
      transition: all 0.2s ease;
      outline: none;
    }
    .input-wrapper input:focus {
      border-color: var(--q-primary);
      box-shadow: 0 0 0 4px rgba(91, 104, 255, 0.15);
      background: rgba(4, 8, 18, 0.8);
    }

    /* Buttons */
    .btn-primary {
      width: 100%;
      background: var(--q-primary);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:hover { background: var(--q-primary-hover); }
    .btn-primary:active { transform: scale(0.98); }

    .auth-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--q-text-muted);
    }
    .auth-footer a { color: var(--q-primary); text-decoration: none; font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }

    /* Toast Container Base */
    .toast { position: fixed; top: 20px; right: 20px; z-index: 9999; }
  </style>
</head>
<body>
  
  <div class="ambient-light light-1"></div>
  <div class="ambient-light light-2"></div>

  <div id="toast" class="toast"></div>
  
  <!-- Pre-rendered DOM: Handed over to app.js upon successful boot -->
  <div id="app" class="login-container">
    <div class="glass-card">
      
      <div class="brand-header">
        <div class="brand-logo">Q</div>
        <h1>Quntet</h1>
        <p>Shared expenses, zero friction.</p>
      </div>

      <form id="static-login-form">
        <div class="input-group">
          <label for="quntet-username">Username or Email</label>
          <div class="input-wrapper">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" id="quntet-username" placeholder="e.g. joshua_m" autocomplete="username" required>
          </div>
        </div>

        <div class="input-group">
          <label for="quntet-password">Password</label>
          <div class="input-wrapper">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="quntet-password" placeholder="Enter your password" autocomplete="current-password" required>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="static-login-btn">
          Sign In to Quntet
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </form>

      <div class="auth-footer">
        <p>New to Quntet? <a href="#register">Create a group</a></p>
      </div>

    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
